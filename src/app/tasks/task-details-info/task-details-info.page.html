<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>task-details-info</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="showMap()">
      <ion-icon name="map" ></ion-icon>
    </ion-fab-button>
  </ion-fab>
  <ion-list>
    <ion-list-header>
      <h1>{{this.task().title}}</h1>
    </ion-list-header>

    <ion-item lines="none">
      <p>{{this.task().description}}</p>
    </ion-item>

    <ion-item lines="none">
      <p>Fecha límite: {{this.task().deadLine | date: 'dd/MM/yyyy'}}</p>
    </ion-item>

    <ion-item lines="none">
      <ion-button color="primary" [routerLink]="['/tasks/add/' + this.task().id]">Modificar</ion-button>
      <ion-button color="danger" (click)="onDelete()">Eliminar</ion-button>
    </ion-item>

    <ion-item lines="none">
      <ion-select [formField]="this.statusForm" interface="popover" (ionChange)="this.onStatusChange($event)" placeholder="Selecciona el tipo">
        <ion-select-option [value]="0" aria-selected="true">Pendientes</ion-select-option>
        <ion-select-option [value]="1">En proceso</ion-select-option>
        <ion-select-option [value]="2">Terminadas</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item lines="none">
      @if(this.auxFilePath()) {
        <ion-img [src]="this.auxFilePath()"></ion-img>
      }
    </ion-item>

    <ion-item lines="none">
      <ion-button [disabled]="this.auxFilePath() == ''" color="danger" (click)="removeImage()">Eliminar imagen</ion-button>
    </ion-item>

    <ion-item lines="none">
      <ion-button color="tertiary" (click)="pickFromGallery()">
        <ion-icon name="images" slot="start"></ion-icon>
        Gallery
      </ion-button>
    </ion-item>
  </ion-list>

  <div olMap [coordinates]="coordinates()" style="height: 20em;">
    <div gaAutocomplete (locationChange)="changePlace($event)"></div>
    <div olMarker [coordinates]="coordinates()"></div>
  </div>
</ion-content>
